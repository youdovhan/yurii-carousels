<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Hormozi carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Oswald:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
:root{
  --paper:#f4eddc;
  --paper2:#ebe2cc;
  --paper-dark:#c8b998;
  --ink:#1a1410;
  --ink-soft:#4a3f33;
  --mute:#7a6a55;
  --blood:#b01c20;
  --amber:#b8722c;
  --amber-dark:#8a5520;
  --green:#3d7a6e;
}
body{background:#1a1a1a;font-family:'IBM Plex Sans',sans-serif}
.slide{
  width:1080px;height:1350px;
  position:relative;overflow:hidden;
  margin:20px auto;
  background:var(--paper);
  color:var(--ink);
  padding:80px 90px;
  display:flex;flex-direction:column;
}
/* lighter grain than harmony */
.slide::before{
  content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(circle at 30% 20%, rgba(184,114,44,0.06), transparent 50%),
    repeating-linear-gradient(37deg, rgba(0,0,0,0.02) 0 1px, transparent 1px 4px);
  mix-blend-mode:multiply;
  pointer-events:none;z-index:1;
}
.slide > *{position:relative;z-index:2}

/* TOP BAR — minimal brand */
.top-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding-bottom:20px;
  border-bottom:3px solid var(--amber);
  margin-bottom:40px;
  font-family:'Oswald',sans-serif;
  font-weight:500;letter-spacing:2px;text-transform:uppercase;
  font-size:14px;color:var(--ink-soft);
}
.top-bar .brand{color:var(--amber-dark);font-weight:700}
.top-bar .num{font-family:'JetBrains Mono',monospace;color:var(--blood)}

/* COVER */
.cover{justify-content:space-between}
.cover .kicker{
  font-family:'Oswald',sans-serif;font-weight:500;
  letter-spacing:4px;text-transform:uppercase;
  font-size:24px;color:var(--amber-dark);
  margin-top:40px;margin-bottom:30px;
}
.cover .headline{
  font-family:'Playfair Display',serif;
  font-weight:900;
  font-size:84px;line-height:1.05;
  letter-spacing:-2px;
  color:var(--ink);
}
.cover .headline em{color:var(--blood);font-style:normal;background:rgba(176,28,32,0.08);padding:0 12px}
.cover .sub{
  font-family:'IBM Plex Sans',sans-serif;
  font-weight:400;
  font-size:32px;line-height:1.3;
  color:var(--ink-soft);
  margin-top:30px;
  max-width:85%;
}
.cover .footer-brand{
  font-family:'JetBrains Mono',monospace;
  font-size:18px;color:var(--ink-soft);
  display:flex;justify-content:space-between;
  border-top:2px solid var(--ink);
  padding-top:20px;
  margin-top:40px;
}

/* H2 slide title */
.slide-title{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:46px;line-height:1.1;
  text-transform:uppercase;
  letter-spacing:-0.5px;
  color:var(--ink);
  margin-bottom:40px;
}
.slide-title::before{
  content:"";display:block;
  width:120px;height:6px;
  background:var(--blood);margin-bottom:24px;
}

/* body content */
.content{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  font-family:'IBM Plex Sans',sans-serif;
  font-size:36px;line-height:1.4;
  color:var(--ink);
}
.content p{margin-bottom:20px}
.content strong{color:var(--blood);font-weight:700}

/* bullet list — for avatar / problems / bonuses */
.bullets{list-style:none;padding:0;margin:20px 0}
.bullets li{
  font-family:'IBM Plex Sans',sans-serif;
  font-size:32px;line-height:1.3;
  padding:16px 0 16px 60px;position:relative;
  border-bottom:1px solid rgba(26,20,16,0.1);
  color:var(--ink);
}
.bullets li::before{
  content:"✓";
  position:absolute;left:0;top:16px;
  color:var(--amber-dark);font-weight:700;
  font-size:36px;
}
.bullets.problems li::before{content:"▸";color:var(--blood)}
.bullets.bonuses li::before{content:"→";color:var(--amber-dark);font-family:'Oswald',sans-serif;font-weight:700}

/* numbered steps */
.steps{list-style:none;padding:0;margin:20px 0;counter-reset:step}
.steps li{
  font-family:'IBM Plex Sans',sans-serif;
  font-size:32px;line-height:1.35;
  padding:24px 0 24px 100px;position:relative;
  border-bottom:1px solid rgba(26,20,16,0.1);
  counter-increment:step;
}
.steps li::before{
  content:"0" counter(step);
  position:absolute;left:0;top:18px;
  font-family:'JetBrains Mono',monospace;
  font-weight:700;font-size:42px;
  color:var(--blood);
}

/* big stat */
.big-stat{
  font-family:'Playfair Display',serif;
  font-weight:900;
  font-size:110px;line-height:1.0;
  color:var(--blood);
  letter-spacing:-3px;
  margin:30px 0 10px 0;
}
.big-stat-label{
  font-family:'Oswald',sans-serif;font-weight:500;
  letter-spacing:3px;text-transform:uppercase;
  font-size:22px;color:var(--ink-soft);
  margin-bottom:30px;
}

/* scene / dream result */
.scene{
  font-family:'Playfair Display',serif;
  font-style:italic;
  font-size:40px;line-height:1.3;
  color:var(--ink);
  padding:40px;
  background:rgba(184,114,44,0.08);
  border-left:6px solid var(--amber);
}

/* CTA slide */
.cta{
  justify-content:space-between;
  background:var(--ink);
  color:var(--paper);
  padding:80px 90px;
}
.cta .top-bar{border-bottom-color:var(--amber);color:rgba(244,237,220,0.7)}
.cta .top-bar .brand{color:var(--amber)}
.cta .directive{
  font-family:'Oswald',sans-serif;font-weight:500;
  letter-spacing:4px;text-transform:uppercase;
  font-size:24px;color:var(--amber);
  margin-top:30px;margin-bottom:20px;
}
.cta .code-word{
  font-family:'Permanent Marker',cursive;
  font-size:180px;
  color:var(--blood);
  text-transform:uppercase;
  letter-spacing:2px;
  margin:30px 0;
  transform:rotate(-2deg);
  line-height:0.9;
}
.cta .instruction{
  font-family:'IBM Plex Sans',sans-serif;
  font-size:36px;line-height:1.35;
  color:var(--paper);
  margin-bottom:20px;
}
.cta .footer-brand{
  color:rgba(244,237,220,0.7);
  border-top:2px solid rgba(244,237,220,0.25);
  padding-top:20px;margin-top:40px;
  font-family:'JetBrains Mono',monospace;font-size:18px;
  display:flex;justify-content:space-between;
}
</style>
</head>
<body>
{{SLIDES}}
</body>
</html>
